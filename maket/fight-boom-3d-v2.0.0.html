<script>

const VERSION='2.0.0',TAU=Math.PI*2,DEG=180/Math.PI,RAD=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,smooth=t=>t*t*(3-2*t);
const uuid=()=>'p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const V={
  add:(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z}),
  sub:(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}),
  mul:(a,s)=>({x:a.x*s,y:a.y*s,z:a.z*s}),
  dot:(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,
  cross:(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x}),
  len:a=>Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z),
  norm:a=>{const l=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z)||1;return{x:a.x/l,y:a.y/l,z:a.z/l};},
  lerp:(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:a.z+(b.z-a.z)*t}),
};
function rotV(v,ax,a){if(!a)return{x:v.x,y:v.y,z:v.z};const c=Math.cos(a),s=Math.sin(a),k=V.dot(ax,v)*(1-c);
  return{x:v.x*c+(ax.y*v.z-ax.z*v.y)*s+ax.x*k,y:v.y*c+(ax.z*v.x-ax.x*v.z)*s+ax.y*k,z:v.z*c+(ax.x*v.y-ax.y*v.x)*s+ax.z*k};}
function l2w(b,v){return{x:b.o.x+b.x.x*v.x+b.y.x*v.y+b.z.x*v.z,y:b.o.y+b.x.y*v.x+b.y.y*v.y+b.z.y*v.z,z:b.o.z+b.x.z*v.x+b.y.z*v.y+b.z.z*v.z};}
function d2w(b,v){return{x:b.x.x*v.x+b.y.x*v.y+b.z.x*v.z,y:b.x.y*v.x+b.y.y*v.y+b.z.y*v.z,z:b.x.z*v.x+b.y.z*v.y+b.z.z*v.z};}
function makeFrame(o,yaw,pitch,roll){let x={x:1,y:0,z:0},y={x:0,y:1,z:0},z={x:0,y:0,z:1};
  if(yaw){x=rotV(x,{x:0,y:1,z:0},yaw);y=rotV(y,{x:0,y:1,z:0},yaw);z=rotV(z,{x:0,y:1,z:0},yaw);}
  if(pitch){x=rotV(x,{x:1,y:0,z:0},pitch);y=rotV(y,{x:1,y:0,z:0},pitch);z=rotV(z,{x:1,y:0,z:0},pitch);}
  if(roll){x=rotV(x,{x:0,y:0,z:1},roll);y=rotV(y,{x:0,y:0,z:1},roll);z=rotV(z,{x:0,y:0,z:1},roll);}
  return{o,x,y,z};}
function subFrame(b,off,yaw,pitch,roll){const o=l2w(b,off);let x={x:b.x.x,y:b.x.y,z:b.x.z},y={x:b.y.x,y:b.y.y,z:b.y.z},z={x:b.z.x,y:b.z.y,z:b.z.z};
  if(yaw){x=rotV(x,y,yaw);z=rotV(z,y,yaw);}if(pitch){y=rotV(y,x,pitch);z=rotV(z,x,pitch);}if(roll){x=rotV(x,z,roll);y=rotV(y,z,roll);}return{o,x,y,z};}
function jointFrame(parent,off,ang){const o=l2w(parent,off);let x={x:parent.x.x,y:parent.x.y,z:parent.x.z},y={x:parent.y.x,y:parent.y.y,z:parent.y.z},z={x:parent.z.x,y:parent.z.y,z:parent.z.z};
  const ax=ang.x||0,ay=ang.y||0,az=ang.z||0;
  if(ay){x=rotV(x,y,ay);z=rotV(z,y,ay);}if(az){x=rotV(x,z,az);y=rotV(y,z,az);}if(ax){y=rotV(y,x,ax);z=rotV(z,x,ax);}return{o,x,y,z};}
function frameFromDir(p,dir,up){const z=V.norm(dir);let upv=up;if(!upv)upv=Math.abs(z.y)>0.95?{x:1,y:0,z:0}:{x:0,y:1,z:0};
  let y=V.sub(upv,V.mul(z,V.dot(upv,z)));if(V.len(y)<1e-6)y=Math.abs(upv.y)>0.9?{x:1,y:0,z:0}:{x:0,y:1,z:0};y=V.norm(y);return{o:p,x:V.cross(y,z),y,z};}
function fOff(f,x,y,z){return{x:f.o.x+f.x.x*x+f.y.x*y+f.z.x*z,y:f.o.y+f.x.y*x+f.y.y*y+f.z.y*z,z:f.o.z+f.x.z*x+f.y.z*y+f.z.z*z};}
function ikLimb(A,T,L1,L2,pole){let d=V.sub(T,A),dist=V.len(d);const maxR=(L1+L2)*0.995,minR=Math.abs(L1-L2)+0.01;
  if(dist<1e-6){d={x:0,y:-1,z:0};dist=1e-6;}const dir=V.norm(d),cd=clamp(dist,minR,maxR),a=(L1*L1-L2*L2+cd*cd)/(2*cd),h=Math.sqrt(Math.max(L1*L1-a*a,0));
  const mid=V.add(A,V.mul(dir,a));let u=V.sub(pole,V.add(A,V.mul(dir,V.dot(V.sub(pole,A),dir))));
  if(V.len(u)<1e-5)u=Math.abs(dir.y)>0.9?{x:1,y:0,z:0}:V.norm(V.cross(dir,{x:0,y:1,z:0}));u=V.norm(u);
  return{A,J:V.add(mid,V.mul(u,h)),E:V.add(A,V.mul(dir,cd)),dir};}
const PMAX=180,parts=[];for(let i=0;i<PMAX;i++)parts.push({life:0,x:0,y:0,z:0,vx:0,vy:0,vz:0,sz:1,c:[200,200,200],g:1,drag:0.98});
function emitPart(p,v,c,life,sz,g,drag){for(let i=0;i<PMAX;i++){const q=parts[i];if(q.life<=0){q.x=p.x;q.y=p.y;q.z=p.z;q.vx=v.x;q.vy=v.y;q.vz=v.z;q.c=c;q.life=life;q.max=life;q.sz=sz;q.g=g==null?1:g;q.drag=drag==null?0.98:drag;return q;}}return null;}
function updateParts(dt){for(let i=0;i<PMAX;i++){const q=parts[i];if(q.life<=0)continue;q.life-=dt;q.vy-=9.2*q.g*dt;const k=Math.pow(q.drag,dt*60);q.vx*=k;q.vy*=k;q.vz*=k;q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;if(q.y<0.005&&q.vy<0){q.y=0.005;q.vy*=-0.25;q.vx*=0.7;q.vz*=0.7;}}}
const COL={woodDark:[78,52,30],woodMid:[110,74,44],woodLite:[140,98,60],woodEdge:[52,34,20],band:[220,60,60],bandDark:[160,40,40],belt:[240,235,220],beltDark:[190,184,170],face:[60,40,24],pad:[52,46,40],sky1:[16,13,11],sky2:[46,34,24],floor1:[58,44,31],floor2:[26,19,14],axisX:[220,60,60],axisY:[60,200,90],axisZ:[60,120,230],jointSel:[255,210,100]};
const B={neck:0.11,chest:0.30,waistH:0.16,headR:0.107,upArm:0.300,foreArm:0.268,thigh:0.450,shin:0.432,hand:0.17,foot:0.17,shHalf:0.190,hipHalf:0.100,standY:0.935,groundFoot:0.088};
function lim(a,b){return{min:a*RAD,max:b*RAD};}
const LIMITS={
  shoulderL:{x:lim(-30,180),y:lim(-90,90),z:lim(-90,90)},shoulderR:{x:lim(-30,180),y:lim(-90,90),z:lim(-90,90)},
  elbowL:{x:lim(0,145),y:lim(0,0),z:lim(0,0)},elbowR:{x:lim(0,145),y:lim(0,0),z:lim(0,0)},
  wristL:{x:lim(-70,70),y:lim(-90,90),z:lim(-20,20)},wristR:{x:lim(-70,70),y:lim(-90,90),z:lim(-20,20)},
  hipL:{x:lim(-30,120),y:lim(-45,45),z:lim(-45,45)},hipR:{x:lim(-30,120),y:lim(-45,45),z:lim(-45,45)},
  kneeL:{x:lim(0,155),y:lim(0,0),z:lim(0,0)},kneeR:{x:lim(0,155),y:lim(0,0),z:lim(0,0)},
  ankleL:{x:lim(-45,45),y:lim(-20,20),z:lim(-30,30)},ankleR:{x:lim(-45,45),y:lim(-20,20),z:lim(-30,30)},
  waist:{x:lim(-38,38),y:lim(-52,52),z:lim(-38,38)},chest:{x:lim(-38,38),y:lim(-52,52),z:lim(-38,38)},neck:{x:lim(-34,34),y:lim(-60,60),z:lim(-34,34)},
};
const JOINT_IDS=Object.keys(LIMITS);
