<canvas id="cv"></canvas>

<script>

/* ===== core.js ===== */
/* ============================================================
   FIGHT-BOOM 3D  ·  v1.0.1  ·  «Деревянный ниндзя»
   Раздел 1. МАТЕМАТИКА (не меняется по ТЗ)
   ============================================================ */

const VERSION = '1.0.1';
const TAU = Math.PI * 2;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);

/* --- векторы --- */
const V = {
  add:  (a, b) => ({ x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }),
  sub:  (a, b) => ({ x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }),
  mul:  (a, s) => ({ x: a.x * s, y: a.y * s, z: a.z * s }),
  dot:  (a, b) => a.x * b.x + a.y * b.y + a.z * b.z,
  cross:(a, b) => ({ x: a.y*b.z - a.z*b.y, y: a.z*b.x - a.x*b.z, z: a.x*b.y - a.y*b.x }),
  len:  a => Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z),
  norm: a => {
    const l = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z) || 1;
    return { x: a.x/l, y: a.y/l, z: a.z/l };
  },
  lerp: (a, b, t) => ({ x: a.x + (b.x-a.x)*t, y: a.y + (b.y-a.y)*t, z: a.z + (b.z-a.z)*t }),
};

/* rotV — поворот вектора v вокруг нормализованной оси ax на угол a (Формула Родрига) */
function rotV(v, ax, a){
  if (!a) return { x: v.x, y: v.y, z: v.z };
  const c = Math.cos(a), s = Math.sin(a), k = V.dot(ax, v) * (1 - c);
  return {
    x: v.x*c + (ax.y*v.z - ax.z*v.y)*s + ax.x*k,
    y: v.y*c + (ax.z*v.x - ax.x*v.z)*s + ax.y*k,
    z: v.z*c + (ax.x*v.y - ax.y*v.x)*s + ax.z*k,
  };
}

/* --- кости (ортонормированные кадры) --- */
function l2w(b, v){
  return {
    x: b.o.x + b.x.x*v.x + b.y.x*v.y + b.z.x*v.z,
    y: b.o.y + b.x.y*v.x + b.y.y*v.y + b.z.y*v.z,
    z: b.o.z + b.x.z*v.x + b.y.z*v.y + b.z.z*v.z,
  };
}
function d2w(b, v){
  return {
    x: b.x.x*v.x + b.y.x*v.y + b.z.x*v.z,
    y: b.x.y*v.x + b.y.y*v.y + b.z.y*v.z,
    z: b.x.z*v.x + b.y.z*v.y + b.z.z*v.z,
  };
}
/* кадр из мировых осей: yaw(вокруг Y) → pitch(вокруг X) → roll(вокруг Z) */
function makeFrame(o, yaw, pitch, roll){
  let x = {x:1,y:0,z:0}, y = {x:0,y:1,z:0}, z = {x:0,y:0,z:1};
  if (yaw)   { x=rotV(x,{x:0,y:1,z:0},yaw); y=rotV(y,{x:0,y:1,z:0},yaw); z=rotV(z,{x:0,y:1,z:0},yaw); }
  if (pitch) { x=rotV(x,{x:1,y:0,z:0},pitch); y=rotV(y,{x:1,y:0,z:0},pitch); z=rotV(z,{x:1,y:0,z:0},pitch); }
  if (roll)  { x=rotV(x,{x:0,y:0,z:1},roll); y=rotV(y,{x:0,y:0,z:1},roll); z=rotV(z,{x:0,y:0,z:1},roll); }
  return { o, x, y, z };
}
/* дочерний кость: тот же кадр + локальные довороты */
function subFrame(b, off, yaw, pitch, roll){
  const o = l2w(b, off);
  let x = {x:b.x.x,y:b.x.y,z:b.x.z}, y = {x:b.y.x,y:b.y.y,z:b.y.z}, z = {x:b.z.x,y:b.z.y,z:b.z.z};
  if (yaw)   { x=rotV(x,y,yaw); y=rotV(y,y,yaw); z=rotV(z,y,yaw); }
  if (pitch) { x=rotV(x,x,pitch); y=rotV(y,x,pitch); z=rotV(z,x,pitch); }
  if (roll)  { x=rotV(x,z,roll); y=rotV(y,z,roll); z=rotV(z,z,roll); }
  return { o, x, y, z };
}
/* кадр из направления (z = dir), up — подсказка для вертикали */
function frameFromDir(p, dir, up){
  const z = V.norm(dir);
  let upv = up;
  if (!upv) upv = Math.abs(z.y) > 0.95 ? {x:1,y:0,z:0} : {x:0,y:1,z:0};
  let y = V.sub(upv, V.mul(z, V.dot(upv, z)));
  if (V.len(y) < 1e-6) y = Math.abs(upv.y) > 0.9 ? {x:1,y:0,z:0} : {x:0,y:1,z:0};
  y = V.norm(y);
  const x = V.cross(y, z);
  return { o: p, x, y, z };
}
function fOff(f, x, y, z){
  return {
    x: f.o.x + f.x.x*x + f.y.x*y + f.z.x*z,
    y: f.o.y + f.x.y*x + f.y.y*y + f.z.y*z,
    z: f.o.z + f.x.z*x + f.y.z*y + f.z.z*z,
  };
}

/* --- двусоставная IK-нога/рука: A→(J)→E, сгиб в сторону pole --- */
function ikLimb(A, T, L1, L2, pole){
  let d = V.sub(T, A);
  let dist = V.len(d);
  const maxR = (L1 + L2) * 0.995, minR = Math.abs(L1 - L2) + 0.01;
  if (dist < 1e-6) { d = {x:0,y:-1,z:0}; dist = 1e-6; }
  const dir = V.norm(d);
  const cd = clamp(dist, minR, maxR);
  const a = (L1*L1 - L2*L2 + cd*cd) / (2*cd);
  const h = Math.sqrt(Math.max(L1*L1 - a*a, 0));
  const mid = V.add(A, V.mul(dir, a));
  let u = V.sub(pole, V.add(A, V.mul(dir, V.dot(V.sub(pole, A), dir))));
  if (V.len(u) < 1e-5) u = Math.abs(dir.y) > 0.9 ? {x:1,y:0,z:0} : V.norm(V.cross(dir, {x:0,y:1,z:0}));
  u = V.norm(u);
  const J = V.add(mid, V.mul(u, h));
  const E = V.add(A, V.mul(dir, cd));
  return { A, J, E, dir };
}

/* --- частицы: пул, без аллокаций в рантайме --- */
const PMAX = 180;
const parts = [];
for (let i = 0; i < PMAX; i++)
  parts.push({ life:0, x:0, y:0, z:0, vx:0, vy:0, vz:0, sz:1, c:[200,200,200], g:1, drag:0.98 });
function emitPart(p, v, c, life, sz, g, drag){
  for (let i = 0; i < PMAX; i++){
    const q = parts[i];
    if (q.life <= 0){
      q.x=p.x; q.y=p.y; q.z=p.z; q.vx=v.x; q.vy=v.y; q.vz=v.z;
      q.c=c; q.life=life; q.max=life; q.sz=sz; q.g=g==null?1:g; q.drag=drag==null?0.98:drag;
      return q;
    }
  }
  return null;
}
function updateParts(dt){
  for (let i = 0; i < PMAX; i++){
    const q = parts[i];
    if (q.life <= 0) continue;
    q.life -= dt;
    q.vy -= 9.2 * q.g * dt;
    const k = Math.pow(q.drag, dt*60);
    q.vx *= k; q.vy *= k; q.vz *= k;
    q.x += q.vx*dt; q.y += q.vy*dt; q.z += q.vz*dt;
    if (q.y < 0.005 && q.vy < 0){ q.y = 0.005; q.vy *= -0.25; q.vx *= 0.7; q.vz *= 0.7; }
  }
}

/* ===== palette.js ===== */
/* ============================================================
   Раздел 2. ПАЛИТРА + КОНСТАНТЫ СКЕЛЕТА
   ============================================================ */

/* --- Палитра «деревянный ниндзя» (ТЗ §1) --- */
const COL = {
  woodDark : [ 78, 52, 30],   // тёмное дерево (суставы, повязка-основа)
  woodMid  : [110, 74, 44],   // среднее дерево (корпус, конечности)
  woodLite : [140, 98, 60],   // светлое дерево (блики на гранях)
  woodEdge : [ 52, 34, 20],   // рёбра/тени между гранями
  band     : [220, 60, 60],   // красная повязка
  bandDark : [160, 40, 40],
  belt     : [240, 235, 220], // белый пояс
  beltDark : [190, 184, 170],
  face     : [ 60, 40, 24],   // «глаза» — тёмные щели
  pad      : [ 52, 46, 40],   // оставить для манекена
  /* сцена */
  sky1:[16,13,11], sky2:[46,34,24],
  floor1:[58,44,31], floor2:[26,19,14],
  glow:[255,196,120],
};

/* --- Длины костей (ТЗ: пропорции, рост 1.80) --- */
const B = {
  neck  : 0.11,     // шея
  chest : 0.30,     // поясница → грудь (верх torsа)
  waistH: 0.16,     // таз → поясница
  headR : 0.107,    // радиус головы-шара
  upArm : 0.300, foreArm: 0.268,   // плечо / предплечье
  thigh : 0.450, shin : 0.432,     // бедро / голень
  hand  : 0.17, foot: 0.17,
  shHalf: 0.190,    // полуразмах плеч
  hipHalf: 0.100,   // полуразмах бёдер
  standY: 0.935,    // высота таза в стойке
  groundFoot: 0.088,// голеностоп над землёй
};

/* ===== render.js ===== */
/* ============================================================
   Раздел 3. РЕНДЕРЕР (софт-рендер, painter, плоские грани)
   Камера, свет, проекция — не меняются по ТЗ
   ============================================================ */

const L1 = V.norm({x:0.42, y:0.80, z:0.55});   // ключевой свет
const L2 = V.norm({x:-0.55, y:0.20, z:0.35});   // подсветка сзади-слева

const RD = {
  canvas:null, ctx:null, W:0, H:0, dpr:1, renderScale:1,
  polys:[], pool:[], np:0,
  shadow:{x:0, z:0, r:0.55, a:0.34},
  flash:[],
  cam:{
    yaw:0.70, pitch:0.16, dist:4.15,
    tx:0.55, ty:0.86, tz:0.06,
    fpx:600, shake:0, sx:0, sy:0,
  },
  // базис камеры (пересчитывается в render)
  ex:{x:0,y:0,z:0}, ey:{x:0,y:1,z:0}, ez:{x:0,y:0,z:1}, pos:{x:0,y:0,z:0},

  init(canvas){
    this.canvas = canvas; this.ctx = canvas.getContext('2d');
    this.resize();
  },
  resize(){
    const d = Math.min(window.devicePixelRatio || 1, 1.6) * this.renderScale;
    this.dpr = d;
    this.W = Math.round(innerWidth * d); this.H = Math.round(innerHeight * d);
    this.canvas.width = this.W; this.canvas.height = this.H;
    this.canvas.style.width = innerWidth + 'px'; this.canvas.style.height = innerHeight + 'px';
  },
  begin(){ this.np = 0; },

  /* грань: pts — массив мировых вершин; col — [r,g,b]; dbl — двусторонняя; nh — явная нормаль */
  face(pts, col, dbl, nh){
    let cx=0, cy=0, cz=0;
    for (let i=0;i<pts.length;i++){ cx+=pts[i].x; cy+=pts[i].y; cz+=pts[i].z; }
    const inv = 1/pts.length; cx*=inv; cy*=inv; cz*=inv;
    let n = nh;
    if (!n){
      n = V.norm(V.cross(V.sub(pts[1],pts[0]), V.sub(pts[2],pts[0])));
      if (!isFinite(n.x)) return;
    }
    let d1 = V.dot(n,L1), d2 = V.dot(n,L2);
    if (dbl){ d1=Math.abs(d1); d2=Math.abs(d2); } else { if(d1<0)d1=0; if(d2<0)d2=0; }
    let k = 0.46 + 0.66*d1 + 0.24*d2 + 0.10*Math.max(0,n.y)
          + 0.10*d1*d1;                       // блик по дереву
    k *= 0.92 + 0.08*clamp((cy+0.3)/2.2, 0, 1); // лёгкий вертикальный подъём
    const r = clamp(col[0]*k, 0, 255)|0, g = clamp(col[1]*k, 0, 255)|0, b = clamp(col[2]*k, 0, 255)|0;
    const p = this.pool[this.np] || (this.pool[this.np] = {v:[], n:{}, c:'', s:null});
    p.v = pts; p.n.x=n.x; p.n.y=n.y; p.n.z=n.z;
    p.c = 'rgb('+r+','+g+','+b+')';
    p.dbl = !!dbl;
    this.polys[this.np] = p; this.np++;
  },

  pr(p, out){
    const q = V.sub(p, this.pos);
    const vx = V.dot(q,this.ex), vy = V.dot(q,this.ey), vz = V.dot(q,this.ez);
    out.x = this.W*0.5 + (vx/vz)*this.cam.fpx + this.cam.sx;
    out.y = this.H*0.5 - (vy/vz)*this.cam.fpx + this.cam.sy;
    out.z = vz;
    return out;
  },

  render(){
    const ctx = this.ctx, c = this.cam, W = this.W, H = this.H;
    /* --- камера --- */
    const cp = Math.cos(c.pitch), sp = Math.sin(c.pitch);
    const cy = Math.cos(c.yaw),  sy = Math.sin(c.yaw);
    this.pos = {
      x: c.tx + sy*cp*c.dist,
      y: c.ty + sp*c.dist + 0.15,
      z: c.tz - cy*cp*c.dist,
    };
    const tgt = {x:c.tx, y:c.ty, z:c.tz};
    this.ez = V.norm(V.sub(tgt, this.pos));
    this.ex = V.norm(V.cross(this.ez, {x:0,y:1,z:0}));
    this.ey = V.cross(this.ex, this.ez);
    // фокус: вписать сцену (±1.25 м в ширину, 1.8 м в высоту) в оба ландшафта
    c.fpx = Math.min(1.62*W, 1.18*H);

    /* тряска */
    if (c.shake > 0){
      c.sx = (Math.random()*2-1)*c.shake*14*W/600;
      c.sy = (Math.random()*2-1)*c.shake*10*W/600;
      c.shake = Math.max(0, c.shake - 0.09);
    } else { c.sx = c.sy = 0; }

    /* --- фон/пол --- */
    const sky = ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0, rgbs(COL.sky1)); sky.addColorStop(1, rgbs(COL.sky2));
    ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);
    // тёплое пятно света за бойцом
    const glow = ctx.createRadialGradient(W*0.55,H*0.30,0, W*0.55,H*0.30, H*0.55);
    glow.addColorStop(0,'rgba(255,180,96,0.10)'); glow.addColorStop(1,'rgba(255,180,96,0)');
    ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);

    this._floorQuad(ctx);
    this._shadowBlob(ctx);

    /* --- полигоны: отсечь задние, отсортировать, нарисовать --- */
    const list = [];
    for (let i=0;i<this.np;i++){
      const p = this.polys[i];
      const cx = p.v[0].x, cyp = p.v[0].y, czp = p.v[0].z;
      let n2c = 0;
      // знак видимости: нормаль к камере?
      const q = V.sub({x:cx,y:cyp,z:czp}, this.pos);
      n2c = -(p.n.x*q.x + p.n.y*q.y + p.n.z*q.z);
      if (!p.dbl && n2c <= 0) continue;      // задняя грань
      let sumZ = 0, ok = true;
      const s = p.s && p.s.length === p.v.length ? p.s : (p.s = new Array(p.v.length));
      for (let k2=0;k2<p.v.length;k2++){
        const out = this._tmp || (this._tmp={});
        const vv = p.v[k2];
        const qq = {x:vv.x-this.pos.x, y:vv.y-this.pos.y, z:vv.z-this.pos.z};
        const vx = qq.x*this.ex.x+qq.y*this.ex.y+qq.z*this.ex.z;
        const vy = qq.x*this.ey.x+qq.y*this.ey.y+qq.z*this.ey.z;
        const vz = qq.x*this.ez.x+qq.y*this.ez.y+qq.z*this.ez.z;
        if (vz < 0.2){ ok = false; break; }
        const pr = 1/vz;
        s[k2] = s[k2] || {x:0,y:0};
        s[k2].x = W*0.5 + vx*pr*c.fpx + c.sx;
        s[k2].y = H*0.5 - vy*pr*c.fpx + c.sy;
        sumZ += vz;
      }
      if (!ok) continue;
      p.z = sumZ/p.v.length;
      list.push(p);
    }
    list.sort((a,b)=>b.z-a.z);

    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(1, W/560);
    ctx.strokeStyle = 'rgba(24,14,8,0.30)';
    ctx.beginPath();
    let lastC = '';
    for (let i=0;i<list.length;i++){
      const p = list[i];
      if (p.c !== lastC){ ctx.fillStyle = lastC = p.c; }
      const s = p.s;
      ctx.beginPath();
      ctx.moveTo(s[0].x, s[0].y);
      for (let k=1;k<s.length;k++) ctx.lineTo(s[k].x, s[k].y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    /* --- частицы --- */
    for (let i=0;i<PMAX;i++){
      const q = parts[i];
      if (q.life <= 0) continue;
      const qq = {x:q.x-this.pos.x, y:q.y-this.pos.y, z:q.z-this.pos.z};
      const vz = qq.x*this.ez.x+qq.y*this.ez.y+qq.z*this.ez.z;
      if (vz < 0.2) continue;
      const vx = qq.x*this.ex.x+qq.y*this.ex.y+qq.z*this.ex.z;
      const vy = qq.x*this.ey.x+qq.y*this.ey.y+qq.z*this.ey.z;
      const a = clamp(q.life/q.max, 0, 1);
      const sz = Math.max(1, q.sz * c.fpx / vz);
      ctx.fillStyle = 'rgba('+q.c[0]+','+q.c[1]+','+q.c[2]+','+(a*0.85).toFixed(3)+')';
      ctx.fillRect(W*0.5 + vx/vz*c.fpx + c.sx - sz*0.5, H*0.5 - vy/vz*c.fpx + c.sy - sz*0.5, sz, sz);
    }

    /* --- вспышки удара (комикс «БУМ») --- */
    for (let i=this.flash.length-1;i>=0;i--){
      const f = this.flash[i];
      f.t += 1/60;
      if (f.t > f.dur){ this.flash.splice(i,1); continue; }
      const u = f.t/f.dur;
      const qq = {x:f.p.x-this.pos.x, y:f.p.y-this.pos.y, z:f.p.z-this.pos.z};
      const vz = qq.x*this.ez.x+qq.y*this.ez.y+qq.z*this.ez.z;
      if (vz < 0.2) continue;
      const vx = qq.x*this.ex.x+qq.y*this.ex.y+qq.z*this.ex.z;
      const vy = qq.x*this.ey.x+qq.y*this.ey.y+qq.z*this.ey.z;
      const x = W*0.5 + vx/vz*c.fpx + c.sx, y = H*0.5 - vy/vz*c.fpx + c.sy;
      const rr = f.r * c.fpx/vz * (0.35 + 0.75*Math.sin(Math.PI*clamp(u,0,1)));
      ctx.fillStyle = 'rgba(255,'+(230-60*u|0)+','+(140-100*u|0)+','+(1-u).toFixed(3)+')';
      ctx.beginPath();
      for (let k=0;k<16;k++){
        const an = k/16*TAU - u*1.2;
        const rad = k%2 ? rr*0.46 : rr;
        const px = x+Math.cos(an)*rad, py = y+Math.sin(an)*rad;
        k ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
      }
      ctx.closePath(); ctx.fill();
    }
    return list.length;
  },

  _floorQuad(ctx){
    const cs = [[-3.4,-3.4],[3.4,-3.4],[3.4,3.4],[-3.4,3.4]].map(c=>{
      const p = {x:c[0], y:-0.02, z:c[1]};
      return this.pr(p, {});
    });
    if (cs.some(p=>p.z<0.2)) return;
    const g = ctx.createLinearGradient(0, Math.min(...cs.map(p=>p.y)), 0, Math.max(...cs.map(p=>p.y)));
    g.addColorStop(0, rgbs(COL.floor2)); g.addColorStop(1, rgbs(COL.floor1));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(cs[0].x,cs[0].y);
    for(let i=1;i<4;i++) ctx.lineTo(cs[i].x,cs[i].y);
    ctx.closePath(); ctx.fill();
    // сетка досок
    ctx.strokeStyle = 'rgba(255,222,170,0.045)'; ctx.lineWidth = 1;
    for (let k=-3;k<=3;k++){
      const a = this.pr({x:k*0.9, y:0, z:-2.7}, {}), b = this.pr({x:k*0.9, y:0, z:2.7}, {});
      if (a.z>0.2&&b.z>0.2){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    }
  },
  _shadowBlob(ctx){
    const c = this.cam;
    const q = this.shadow;
    const p = this.pr({x:q.x, y:0.002, z:q.z}, {});
    if (p.z < 0.2) return;
    const rx = q.r * c.fpx/p.z, ry = rx*0.30;
    const g = ctx.createRadialGradient(p.x,p.y,0, p.x,p.y,rx);
    g.addColorStop(0, 'rgba(0,0,0,'+(q.a).toFixed(3)+')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.save(); ctx.translate(p.x,p.y); ctx.scale(1, ry/rx);
    ctx.beginPath(); ctx.arc(0,0,rx,0,TAU); ctx.fill(); ctx.restore();
  },
};
function rgbs(c){ return 'rgb('+c[0]+','+c[1]+','+c[2]+')'; }

/* ============================================================
   Раздел 4. ПРИМИТИВЫ ГЕОМЕТРИИ
   ============================================================ */

/* конус-призма между точками A→B; prof(t) — профиль радиуса */
function seg(A, Bp, rA, rB, n, col, prof, dbl){
  let dx=Bp.x-A.x, dy=Bp.y-A.y, dz=Bp.z-A.z;
  const hh = Math.sqrt(dx*dx+dy*dy+dz*dz);
  if (hh < 1e-6) return;
  const ax = {x:dx/hh, y:dy/hh, z:dz/hh};
  const up = Math.abs(ax.y) > 0.97 ? {x:1,y:0,z:0} : {x:0,y:1,z:0};
  const rx = V.norm(V.cross(up, ax)), ry = V.cross(ax, rx);
  const rr = [ rA*(prof?prof(0):1), (rA+rB)*0.5*(prof?prof(0.5):1), rB*(prof?prof(1):1) ];
  const rings = new Array(3);
  for (let ri=0; ri<3; ri++){
    const c = {x:A.x+dx*(ri*0.5), y:A.y+dy*(ri*0.5), z:A.z+dz*(ri*0.5)};
    const rad = rr[ri]; const pts = new Array(n);
    for (let i=0;i<n;i++){
      const an = i/n*TAU, ca = Math.cos(an)*rad, sa = Math.sin(an)*rad;
      pts[i] = {x:c.x+rx.x*ca+ry.x*sa, y:c.y+rx.y*ca+ry.y*sa, z:c.z+rx.z*ca+ry.z*sa};
      pts[i].c0 = c;
    }
    rings[ri] = pts;
  }
  for (let ri=0; ri<2; ri++){
    const r0 = rings[ri], r1 = rings[ri+1];
    for (let i=0;i<n;i++){
      const j = (i+1)%n;
      const m = {x:(r0[i].x+r1[j].x)*0.5, y:(r0[i].y+r1[j].y)*0.5, z:(r0[i].z+r1[j].z)*0.5};
      const hint = V.norm(V.sub(m, {x:(r0[i].c0.x+r1[j].c0.x)*0.5, y:(r0[i].c0.y+r1[j].c0.y)*0.5, z:(r0[i].c0.z+r1[j].c0.z)*0.5}));
      let nn = V.norm(V.cross(V.sub(r0[j],r0[i]), V.sub(r1[i],r0[i])));
      if (V.dot(nn,hint) < 0) nn = V.mul(nn,-1);
      RD.face([r0[i], r0[j], r1[j], r1[i]], col, dbl, nn);
    }
  }
  if (rA > 2.5e-3) RD.face(rings[0].slice().reverse(), col, dbl, {x:-ax.x,y:-ax.y,z:-ax.z});
  if (rB > 2.5e-3) RD.face(rings[2], col, dbl, ax);
}

/* тело вращения: base + axis*height, rings колец, segs граней, radiusFn(t) */
function lathe(base, axis, height, rings, segs, radiusFn, col, dbl){
  const ax = V.norm(axis);
  const up = Math.abs(ax.y) > 0.97 ? {x:1,y:0,z:0} : {x:0,y:1,z:0};
  const rx = V.norm(V.cross(up, ax)), ry = V.cross(ax, rx);
  const rr = new Array(rings), ringPts = new Array(rings), cxs = new Array(rings);
  for (let ri=0; ri<rings; ri++){
    const t = ri/(rings-1);
    const c = V.add(base, V.mul(ax, height*t));
    cxs[ri] = c;
    const rad = radiusFn(t); rr[ri] = rad;
    const pts = new Array(segs);
    for (let si=0; si<segs; si++){
      const an = si/segs*TAU, ca = Math.cos(an)*rad, sa = Math.sin(an)*rad;
      pts[si] = {x:c.x+rx.x*ca+ry.x*sa, y:c.y+rx.y*ca+ry.y*sa, z:c.z+rx.z*ca+ry.z*sa};
    }
    ringPts[ri] = pts;
  }
  for (let ri=0; ri<rings-1; ri++){
    const r0 = ringPts[ri], r1 = ringPts[ri+1];
    if (rr[ri] < 1e-4 && rr[ri+1] < 1e-4) continue;
    for (let si=0; si<segs; si++){
      const j = (si+1)%segs;
      const m = {x:(r0[si].x+r1[j].x)*0.5, y:(r0[si].y+r1[j].y)*0.5, z:(r0[si].z+r1[j].z)*0.5};
      const cM = {x:(cxs[ri].x+cxs[ri+1].x)*0.5, y:(cxs[ri].y+cxs[ri+1].y)*0.5, z:(cxs[ri].z+cxs[ri+1].z)*0.5};
      const hint = V.sub(m, cM);
      let nn = V.norm(V.cross(V.sub(r0[j],r0[si]), V.sub(r1[si],r0[si])));
      if (V.dot(nn,hint) < 0) nn = V.mul(nn,-1);
      RD.face([r0[si], r0[j], r1[j], r1[si]], col, dbl, nn);
    }
  }
  if (rr[0] > 2.5e-3) RD.face(ringPts[0].slice().reverse(), col, dbl, V.mul(ax,-1));
  if (rr[rings-1] > 2.5e-3) RD.face(ringPts[rings-1], col, dbl, ax);
}

/* ориентированный бокс: frame или точка + половины размеров */
function box(f0, sx, sy, sz, col, dbl){
  const f = f0.o ? f0 : {o:f0, x:{x:1,y:0,z:0}, y:{x:0,y:1,z:0}, z:{x:0,y:0,z:1}};
  const cx=[], cy=[], cz=[];
  const P = (ax, ay, az) => ({
    x: f.o.x + f.x.x*ax*sx + f.y.x*ay*sy + f.z.x*az*sz,
    y: f.o.y + f.x.y*ax*sx + f.y.y*ay*sy + f.z.y*az*sz,
    z: f.o.z + f.x.z*ax*sx + f.y.z*ay*sy + f.z.z*az*sz,
  });
  const c = {
    nnn:P(-1,-1,-1), pnn:P(1,-1,-1), npn:P(-1,1,-1), ppn:P(1,1,-1),
    nnp:P(-1,-1,1), pnp:P(1,-1,1), npp:P(-1,1,1), ppp:P(1,1,1),
  };
  const NX={x:f.x.x,y:f.x.y,z:f.x.z}, NY={x:f.y.x,y:f.y.y,z:f.y.z}, NZ={x:f.z.x,y:f.z.y,z:f.z.z};
  RD.face([c.pnn,c.pnp,c.ppp,c.ppn], col, dbl, NX);
  RD.face([c.nnp,c.npn,c.npp,c.nnn], col, dbl, V.mul(NX,-1));
  RD.face([c.npn,c.ppn,c.ppp,c.npp], col, dbl, NY);
  RD.face([c.nnn,c.pnn,c.pnp,c.nnp], col, dbl, V.mul(NY,-1));
  RD.face([c.nnp,c.pnp,c.ppp,c.npp], col, dbl, NZ);   // исправление ниже не нужно:
  RD.face([c.nnn,c.npn,c.ppn,c.pnn], col, dbl, V.mul(NZ,-1));
}

/* ===== body.js ===== */
/* ============================================================
   Раздел 4b. СКЕЛЕТ: сборка поз (математика не меняется по ТЗ)
   ============================================================ */

const ROOT_YAW = Math.PI/2 * 0.998;  // ниндзя «смотрит» на манекен (+X)

function pelvisFrame(P){
  return makeFrame(
    {x:P.px, y:B.standY + P.y, z:P.pz},
    ROOT_YAW + P.yaw, 0, P.roll
  );
}

function buildSkeleton(P){
  const pelvis = pelvisFrame(P);
  const waist  = subFrame(pelvis, {x:0,y:0.16,z:0}, P.twist*0.30, P.lean*0.42, P.roll*0.30);
  const chest  = subFrame(waist,  {x:0,y:0.24,z:0}, P.twist*0.45, P.lean*0.52, P.roll*0.15);
  const neck   = subFrame(chest,  {x:0,y:B.chest,z:0}, P.hy*0.15, P.hp*0.35, 0);
  const head   = subFrame(neck,   {x:0,y:B.neck,z:0},  P.hy, P.hp, 0);

  const shL = { o: l2w(chest, {x:-B.shHalf, y:0.06, z:0}) };
  const shR = { o: l2w(chest, {x: B.shHalf, y:0.06, z:0}) };
  const hipL= { o: l2w(pelvis,{x:-B.hipHalf, y:-0.10, z:0}) };
  const hipR= { o: l2w(pelvis,{x: B.hipHalf, y:-0.10, z:0}) };

  const pv = a => Array.isArray(a) ? {x:a[0], y:a[1], z:a[2]} : a;
  const armL = ikLimb(shL.o, l2w(chest,pv(P.hL)), B.upArm, B.foreArm,
                 V.add(shL.o, d2w(chest,{x:-0.34, y:-0.62, z:-0.18})));
  const armR = ikLimb(shR.o, l2w(chest,pv(P.hR)), B.upArm, B.foreArm,
                 V.add(shR.o, d2w(chest,{x: 0.34, y:-0.62, z:-0.18})));
  const legL = ikLimb(hipL.o, l2w(pelvis,pv(P.fL)), B.thigh, B.shin,
                 V.add(hipL.o, d2w(pelvis,{x:-0.14, y:-0.20, z:0.42})));
  const legR = ikLimb(hipR.o, l2w(pelvis,pv(P.fR)), B.thigh, B.shin,
                 V.add(hipR.o, d2w(pelvis,{x: 0.14, y:-0.20, z:0.42})));

  // кисти: продолжение предплечья
  const handL = { p: armL.E, d: armL.dir };
  const handR = { p: armR.E, d: armR.dir };
  // стопы: направление — «вперёд» таза, ортогональное голени
  const shnL = V.norm(V.sub(legL.E, legL.J)), shnR = V.norm(V.sub(legR.E, legR.J));
  const fwd  = d2w(pelvis, {x:0,y:0,z:1});
  let fL = V.sub(fwd, V.mul(shnL, V.dot(fwd, shnL)));
  if (V.len(fL) < 1e-4) fL = fwd;
  let fR = V.sub(fwd, V.mul(shnR, V.dot(fwd, shnR)));
  if (V.len(fR) < 1e-4) fR = fwd;
  const footL = { p: legL.E, d: V.norm(fL), up: V.mul(shnL,-1) };
  const footR = { p: legR.E, d: V.norm(fR), up: V.mul(shnR,-1) };

  return { pelvis, waist, chest, neck, head, shL, shR, hipL, hipR,
           armL, armR, legL, legR, handL, handR, footL, footR };
}

/* ============================================================
   Раздел 5. ТЕЛО: деревянный ниндзя (ТЗ §2)
   ============================================================ */

function buildBody(sk){
  const waistP = sk.waist.o, chestP = sk.chest.o;

  /* --- ТОРС --- */
  // таз
  seg(l2w(sk.pelvis,{x:0,y:-0.10,z:0}),
      l2w(sk.pelvis,{x:0,y: 0.06,z:0}),
      0.150, 0.140, 8, COL.woodMid,
      t=>1-0.18*Math.cos(t*Math.PI));
  // поясница
  seg(waistP, chestP, 0.145, 0.165, 8, COL.woodMid,
      t=>1+0.06*Math.sin(t*Math.PI));
  // грудь
  seg(chestP,
      l2w(sk.chest,{x:0,y:B.chest*0.72,z:0}),
      0.168, 0.152, 8, COL.woodMid,
      t=>1-0.10*t);
  // «клеймо» — тёмная насечка на груди (бонус из ТЗ, 1 бокс)
  {
    const fw = d2w(sk.chest,{x:0,y:0,z:1});
    const up = d2w(sk.chest,{x:0,y:1,z:0});
    const kpos = V.add(l2w(sk.chest,{x:0,y:0.06,z:0}), V.mul(fw, 0.152));
    box(frameFromDir(kpos, fw, up), 0.030, 0.014, 0.006, COL.woodEdge);
  }

  /* --- ШЕЯ --- */
  const nkB = sk.neck.o;
  const nkT = l2w(sk.neck,{x:0,y:B.neck,z:0});
  seg(nkB, nkT, 0.058, 0.052, 6, COL.woodMid);

  /* --- ГОЛОВА: шар + две щели-глаза (ТЗ §9: лица-носа больше нет) --- */
  const hUp = d2w(sk.head,{x:0,y:1,z:0});
  const hFw = d2w(sk.head,{x:0,y:0,z:1});
  const hR  = d2w(sk.head,{x:1,y:0,z:0});
  const hC  = V.add(nkT, V.mul(hUp, B.headR*0.92));
  lathe(V.add(nkT, V.mul(hUp,-B.headR*0.15)), hUp,
        B.headR*1.95, 8, 6,
        t=>B.headR*Math.pow(Math.sin(Math.PI*clamp(t*0.92+0.06,0,1)),0.72)*1.02+0.004,
        COL.woodMid);
  {
    const faceF = frameFromDir(V.add(hC, V.mul(hFw, B.headR*0.905)), hFw, hUp);
    for (const s of [-1,1]){
      const e0 = fOff(faceF, s*B.headR*0.36, B.headR*0.10, 0);
      const nrm = V.norm(V.add(hFw, V.mul(hUp,-0.12)));
      box(frameFromDir(V.add(e0, V.mul(nrm, 0.004)), nrm, hUp),
          B.headR*0.20, B.headR*0.055, B.headR*0.032, COL.face);
    }
  }

  /* --- СУСТАВЫ-ШАРЫ (поверх костей) --- */
  drawJoints(sk);

  /* --- РУКИ --- */
  for (const side of ['L','R']){
    const a = sk['arm'+side];
    seg(a.A, a.J, 0.048, 0.040, 6, COL.woodMid, t=>1+0.07*Math.sin(t*Math.PI));
    // верёвочная обмотка предплечья (бонус ТЗ — 2 тонких кольца)
    const fa = V.norm(V.sub(a.E, a.J));
    for (const q of [0.45, 0.72]){
      const c = V.add(a.J, V.mul(fa, 0.268*q));
      seg(V.add(c, V.mul(fa,-0.008)), V.add(c, V.mul(fa,0.008)), 0.0375, 0.0375, 6, COL.woodDark);
    }
    seg(a.J, a.E, 0.040, 0.032, 6, COL.woodMid, t=>1+0.04*Math.sin(t*Math.PI*0.8));
    drawHand(sk['hand'+side], side);
  }

  /* --- НОГИ --- */
  for (const side of ['L','R']){
    const l = sk['leg'+side];
    seg(l.A, l.J, 0.075, 0.062, 7, COL.woodMid, t=>1+0.10*Math.sin(t*Math.PI));
    seg(l.J, l.E, 0.062, 0.045, 7, COL.woodMid, t=>1+0.06*Math.sin(t*Math.PI*0.7));
    const shd = V.norm(V.sub(l.E, l.J));
    for (const q of [0.5, 0.75]){
      const c = V.add(l.J, V.mul(shd, 0.432*q));
      seg(V.add(c, V.mul(shd,-0.008)), V.add(c, V.mul(shd,0.008)), 0.050, 0.050, 7, COL.woodDark);
    }
    drawFoot(sk['foot'+side]);
  }

  /* --- ПОВЯЗКА И ПОЯС (объёмные ленты) --- */
  drawBand(sk);
  drawBelt(sk);
}

/* --- СУСТАВЫ-ШАРЫ (ТЗ §3): рисуются поверх костей, «обточенный» вид --- */
function drawJoints(sk){
  const up = {x:0,y:1,z:0};
  const joint = (pos, r, col) => {
    lathe(V.add(pos,{x:0,y:-r,z:0}), up, r*2.0, 4, 6,
          t=>r*Math.sin(Math.PI*clamp(t*0.9+0.05,0,1))*1.02+0.002, col);
  };
  joint(sk.shL.o,   0.052, COL.woodDark);  // плечи
  joint(sk.shR.o,   0.052, COL.woodDark);
  joint(sk.armL.J,  0.040, COL.woodLite);  // локти
  joint(sk.armR.J,  0.040, COL.woodLite);
  joint(sk.armL.E,  0.045, COL.woodDark);  // кисти (основания)
  joint(sk.armR.E,  0.045, COL.woodDark);
  joint(sk.hipL.o,  0.058, COL.woodDark);  // бёдра
  joint(sk.hipR.o,  0.058, COL.woodDark);
  joint(sk.legL.J,  0.048, COL.woodLite);  // колени
  joint(sk.legR.J,  0.048, COL.woodLite);
  joint(sk.legL.E,  0.038, COL.woodDark);  // голеностопы
  joint(sk.legR.E,  0.038, COL.woodDark);
  joint(sk.neck.o,  0.045, COL.woodDark);  // шея (основание)
  joint(sk.waist.o, 0.055, COL.woodDark);  // поясница
}

/* --- КИСТЬ: деревянная рукавица с фаской (ТЗ §4) --- */
function drawHand(h, side){
  const f = frameFromDir(h.p, h.d, null);
  const palm = fOff(f, 0, 0, B.hand*0.40);
  box(palm, B.hand*0.30, B.hand*0.35, B.hand*0.38, COL.woodMid);
  const bevel = fOff(f, 0, 0, B.hand*0.72);
  box(bevel, B.hand*0.26, B.hand*0.30, B.hand*0.14, COL.woodLite);
  const thumb = fOff(f, (side==='R'?1:-1)*B.hand*0.28, -B.hand*0.10, B.hand*0.32);
  box(thumb, B.hand*0.14, B.hand*0.16, B.hand*0.22, COL.woodMid);
}

/* --- СТОПА: деревянная колодка (ТЗ §5) --- */
function drawFoot(ft){
  const f = frameFromDir(ft.p, ft.d, ft.up ? V.norm(ft.up) : null);
  const heel = fOff(f, 0, -B.foot*0.04, -B.foot*0.20);
  box(heel, B.foot*0.18, B.foot*0.14, B.foot*0.22, COL.woodMid);
  const sole = fOff(f, 0, -B.foot*0.02, B.foot*0.15);
  box(sole, B.foot*0.20, B.foot*0.12, B.foot*0.42, COL.woodMid);
  const toe = fOff(f, 0, B.foot*0.02, B.foot*0.58);
  box(toe, B.foot*0.18, B.foot*0.09, B.foot*0.14, COL.woodLite);
}

/* --- ПОВЯЗКА: объёмная лента вокруг головы + два хвоста (ТЗ §6) --- */
function drawBand(sk){
  const hUp = d2w(sk.head,{x:0,y:1,z:0});
  const hFw = d2w(sk.head,{x:0,y:0,z:1});
  const hR  = d2w(sk.head,{x:1,y:0,z:0});
  const hC  = V.add(sk.neck.o, V.mul(hUp, B.neck + B.headR*0.92));

  const bandC = V.add(hC, V.mul(hUp, B.headR*0.14));
  lathe(V.add(bandC, V.mul(hUp,-B.headR*0.09)), hUp, B.headR*0.30, 3, 8,
        t=>B.headR*1.115 - Math.abs(t-0.5)*B.headR*0.10, COL.band);

  const back = V.mul(hFw, -1);
  const tailBase = V.add(bandC, V.mul(back, B.headR*0.90));
  for (const s of [-1, 1]){
    const tOff = V.mul(hR, s*B.headR*0.25);
    const tip = V.add(tailBase,
                V.add(tOff,
                  V.add(V.mul(back, B.headR*1.05),
                        V.mul({x:0,y:-1,z:0}, B.headR*0.60))));
    seg(V.add(tailBase, tOff), tip, 0.014, 0.008, 4, COL.band);
  }
}

/* --- ПОЯС: кольцо + узел + два хвоста (ТЗ §7) --- */
function drawBelt(sk){
  const wUp = d2w(sk.waist,{x:0,y:1,z:0});
  const wBase = l2w(sk.pelvis,{x:0,y:0.02,z:0});

  lathe(V.add(wBase, V.mul(wUp,-0.03)), wUp, 0.062, 3, 8, t=>0.157, COL.belt);

  const wFw = d2w(sk.pelvis,{x:0,y:0,z:1});
  const knot = V.add(wBase, V.mul(wFw, 0.142));
  box(frameFromDir(knot, wFw, wUp), 0.035, 0.030, 0.026, COL.beltDark);

  const wBk = V.mul(wFw, -1);
  const tailBase = V.add(wBase, V.mul(wBk, 0.13));
  for (const s of [-1, 1]){
    const tOff = V.mul(d2w(sk.pelvis,{x:1,y:0,z:0}), s*0.045);
    const tip = V.add(tailBase,
                V.add(tOff,
                  V.add(V.mul(wBk, 0.08),
                        V.mul({x:0,y:-1,z:0}, 0.12))));
    seg(V.add(tailBase, tOff), tip, 0.020, 0.012, 4, COL.belt);
  }
}

const DUM = { x:1.02, z:0.10, r:0.17, a:0, v:0 };

function dummyUpdate(dt){
  const k = 34, c = 3.2;
  DUM.v += (-k*DUM.a - c*DUM.v) * dt;
  DUM.a += DUM.v * dt;
  DUM.a = clamp(DUM.a, -0.34, 0.34);
}

function buildDummy(){
  const Z = {x:0,y:0,z:1};
  const base = {x:DUM.x, y:0, z:DUM.z};
  const vv = o => ({x:o.x||0, y:o.y||0, z:o.z||0});
  const rp = (lp) => V.add(base, rotV(vv(lp), Z, -DUM.a));
  const rd = (ld) => rotV(V.norm(vv(ld)), Z, -DUM.a);

  // стационарное основание
  seg({x:base.x,y:0,z:base.z}, {x:base.x,y:0.075,z:base.z}, 0.30, 0.26, 8, COL.pad);
  // бревно
  seg(rp({y:0.05}), rp({y:1.42}), 0.150, 0.112, 8, COL.woodMid,
      t=>1+0.05*Math.sin(t*Math.PI));
  // верёвочные обмотки (макивара)
  for (const q of [0.16, 0.52, 0.84]){
    const a0 = rp({y:0.05+(1.42-0.05)*q});
    seg(V.add(a0,{x:0,y:-0.014,z:0}), V.add(a0,{x:0,y:0.014,z:0}),
        0.155-0.038*q, 0.155-0.038*q, 8, COL.woodEdge);
  }
  // три руки (две верхние, одна средняя) + нижняя «нога»
  const arms = [
    {h:1.14, d:{x:-1.0, y: 0.06, z: 0.16}, len:0.44, pad:1},
    {h:1.18, d:{x: 0.95, y:-0.10, z: 0.30}, len:0.40, pad:1},
    {h:0.86, d:{x:-1.0, y:-0.16, z:-0.10}, len:0.40, pad:1},
    {h:0.42, d:{x:-0.8, y:-0.85, z: 0.45}, len:0.46, pad:0},
  ];
  for (const a of arms){
    const p0 = rp({y:a.h}), d = rd(a.d), p1 = V.add(p0, V.mul(d, a.len));
    seg(p0, p1, 0.062, 0.046, 6, COL.woodMid);
    if (a.pad){
      const tp = V.add(p1, V.mul(d, 0.03));
      const f = frameFromDir(tp, d, null);
      box(f, 0.030, 0.055, 0.055, COL.pad);
    }
  }

}

/* попадание по манекену: расстояние точки до оси бревна */
function dummyHit(p, thr){
  const dx = p.x - DUM.x, dz = p.z - DUM.z;
  const horiz = Math.sqrt(dx*dx + dz*dz);
  return (horiz < thr && p.y > 0.12 && p.y < 1.60) ? {x:DUM.x + dx*(DUM.r/horiz), y:p.y, z:DUM.z + dz*(DUM.r/horiz), horiz} : null;
}

/* ===== cloth.js ===== */
/* ============================================================
   Раздел 6. ТКАНЬ: 2 короткие верле-панели (хвосты повязки/пояса)
   (ТЗ §8: было 7 панелей — стало 2, MAXS=0.02, коллизии убраны)
   ============================================================ */

function makePanel(cols, rows, sx, sy){
  const pts = [];
  for (let j=0;j<rows;j++)
    for (let i=0;i<cols;i++)
      pts.push({ x:0,y:0,z:0, px:0,py:0,pz:0, pin:(j===0), i, j });
  const cons = [];
  const idx = (i,j)=> j*cols+i;
  for (let j=0;j<rows;j++) for (let i=0;i<cols;i++){
    if (i<cols-1) cons.push([idx(i,j), idx(i+1,j), sx]);
    if (j<rows-1) cons.push([idx(i,j), idx(i,j+1), sy]);
    if (i<cols-1 && j<rows-1){
      cons.push([idx(i,j), idx(i+1,j+1), Math.sqrt(sx*sx+sy*sy)]);
      cons.push([idx(i+1,j), idx(i,j+1), Math.sqrt(sx*sx+sy*sy)]);
    }
  }
  return { cols, rows, sx, sy, pts, cons, col:COL.band, colD:COL.bandDark, seeded:false };
}

const CLOTH = {
  band: makePanel(4, 3, 0.028, 0.042),
  belt: makePanel(4, 3, 0.030, 0.055),
  wind: 0,
  pelV:   {x:0,y:0,z:0},
  pelPrev:{x:0,y:0,z:0},
  pelA:   {x:0,y:0,z:0},
  MAXS: 0.02,
  panels(){ return [this.band, this.belt]; },

  pin(sk){
    const pts = [];
    /* хвост повязки — сзади головы */
    const hUp = d2w(sk.head,{x:0,y:1,z:0});
    const hBk = V.mul(d2w(sk.head,{x:0,y:0,z:1}), -1);
    const hR  = d2w(sk.head,{x:1,y:0,z:0});
    const hC  = V.add(sk.neck.o, V.mul(hUp, B.neck + B.headR*0.92));
    const bandBack = V.add(hC, V.mul(hBk, B.headR*0.92));
    for (let i=0;i<this.band.cols;i++){
      const t = (i/(this.band.cols-1) - 0.5) * 0.10;
      pts.push({ pn:this.band, i, p: V.add(bandBack, V.mul(hR, t)) });
    }
    /* хвост пояса — сзади таза */
    const wBk = V.mul(d2w(sk.pelvis,{x:0,y:0,z:1}), -1);
    const wR  = d2w(sk.pelvis,{x:1,y:0,z:0});
    const beltBack = V.add(l2w(sk.pelvis,{x:0,y:0.06,z:0}), V.mul(wBk, 0.135));
    for (let i=0;i<this.belt.cols;i++){
      const t = (i/(this.belt.cols-1) - 0.5) * 0.10;
      pts.push({ pn:this.belt, i, p: V.add(beltBack, V.mul(wR, t)) });
    }
    return pts;
  },

  seed(sk){
    for (const pin of this.pin(sk)){
      for (let j=0;j<pin.pn.rows;j++){
        const p = pin.pn.pts[pin.i + j*pin.pn.cols];
        p.x = p.px = pin.p.x;
        p.y = p.py = pin.p.y - j*pin.pn.sy;
        p.z = p.pz = pin.p.z;
      }
      pin.pn.seeded = true;
    }
  },

  update(sk, dt, time){
    /* скорость таза → «ветер» */
    const o = sk.pelvis.o;
    const inv = 1/Math.max(dt,1e-4);
    this.pelV = V.mul(V.sub(o, this.pelPrev), inv);
    this.pelPrev = {x:o.x, y:o.y, z:o.z};
    const windMag = clamp(V.len(this.pelV), 0, 7);
    const wx = -this.pelV.x*0.55, wz = -this.pelV.z*0.55;

    /* пины */
    for (const q of this.pin(sk)){
      const p = q.pn.pts[q.i];
      p.x = q.p.x; p.y = q.p.y; p.z = q.p.z;
      p.px = p.x; p.py = p.y; p.pz = p.z;
    }
    /* верле */
    const g = -9.6*dt*dt, damp = 0.984;
    for (const pn of this.panels()){
      for (const p of pn.pts){
        if (p.pin) continue;
        let vx=(p.x-p.px)*damp, vy=(p.y-p.py)*damp, vz=(p.z-p.pz)*damp;
        const sp = Math.sqrt(vx*vx+vy*vy+vz*vz);
        if (sp > this.MAXS){ const s=this.MAXS/sp; vx*=s; vy*=s; vz*=s; }
        const flut = 0.0009*(0.4+windMag)*Math.sin(time*9 + p.j*2.1 + p.i);
        p.px=p.x; p.py=p.y; p.pz=p.z;
        p.x += vx + (wx*0.0004 + flut);
        p.y += vy + g;
        p.z += vz + (wz*0.0004 + flut*0.6);
      }
      /* связи, 3 итерации (коллизии с ногами убраны — хвосты короткие) */
      for (let it=0; it<3; it++){
        for (const [a,b,rest] of pn.cons){
          const pa=pn.pts[a], pb=pn.pts[b];
          let dx=pb.x-pa.x, dy=pb.y-pa.y, dz=pb.z-pa.z;
          const d = Math.sqrt(dx*dx+dy*dy+dz*dz);
          if (d < 1e-7) continue;
          const w = (d-rest)/d*0.5;
          if (!pa.pin){ pa.x+=dx*w; pa.y+=dy*w; pa.z+=dz*w; }
          if (!pb.pin){ pb.x-=dx*w*(pa.pin?2:1)*0.5; pb.y-=dy*w*(pa.pin?2:1)*0.5; pb.z-=dz*w*(pa.pin?2:1)*0.5; }
        }
        for (const p of pn.pts){
          if (p.pin) continue;
          if (p.y < 0.012){ p.y = 0.012; p.x -= (p.x-p.px)*0.5; p.z -= (p.z-p.pz)*0.5; }
        }
      }
    }
  },

  draw(){
    for (const pn of this.panels()){
      const {cols, rows, pts} = pn;
      for (let j=0;j<rows-1;j++) for (let i=0;i<cols-1;i++){
        const a=pts[i+j*cols], b=pts[i+1+j*cols],
              c=pts[i+1+(j+1)*cols], d=pts[i+(j+1)*cols];
        const A={x:a.x,y:a.y,z:a.z},Bp={x:b.x,y:b.y,z:b.z},
              C={x:c.x,y:c.y,z:c.z},D={x:d.x,y:d.y,z:d.z};
        const shade = [1,0.87,0.72][j]||0.7;
        const col = [
          Math.round(((j%2? pn.colD:pn.col)[0])*shade),
          Math.round(((j%2? pn.colD:pn.col)[1])*shade),
          Math.round(((j%2? pn.colD:pn.col)[2])*shade)
        ];
        RD.face([A,Bp,C,D], col, true);
      }
    }
  },
};

/* ============================================================
   Раздел 7. АНИМАЦИИ: MOVES, evalKeys, idleState (математика — без изменений)
   Поза: корень(y,px,pz,yaw,roll) + торс(lean,twist) + голова(hy,hp)
   руки: hL/hR — цели кистей в системе груди
   ноги: fL/fR — цели стоп в системе таза
   ============================================================ */

const GY = (py) => -0.905 - py;   // y стопы на земле (таз на 0.935+py)

function lerpV(a, b, t){ return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; }

function evalKeys(keys, t){
  const out = {};
  for (const k in keys){
    const seq = keys[k];
    let i = 0;
    while (i < seq.length-2 && seq[i+1][0] <= t) i++;
    const [t0,v0] = seq[i], [t1,v1] = seq[i+1];
    const s = t1 > t0 ? clamp((t-t0)/(t1-t0), 0, 1) : 1;
    const e = smooth(s);
    out[k] = (typeof v0 === 'number') ? lerp(v0, v1, e) : lerpV(v0, v1, e);
  }
  return out;
}

/* дыхание/микродвижение стойки */
function idleState(t){
  const b = Math.sin(t*2.15), b2 = Math.sin(t*2.15+0.7), sway = Math.sin(t*0.63);
  const y = -0.018 + 0.012*b;
  return {
    y,
    px:0, pz:0,
    yaw: 0.028*sway,
    roll: 0.012*Math.sin(t*1.08+1),
    lean: 0.07 + 0.02*b2,
    twist: 0.06 + 0.05*Math.sin(t*0.5),
    hy: -0.90 + 0.10*Math.sin(t*0.44+2),
    hp: 0.02 + 0.03*b2,
    hL:[-0.135 + 0.012*b, -0.055 + 0.025*b, 0.300 + 0.020*b2],
    hR:[ 0.135 + 0.010*b2, -0.080 + 0.025*b2, 0.285 + 0.018*b ],
    fL:[-0.115, GY(y), -0.185],
    fR:[ 0.115, GY(y),  0.200],
  };
}

/* поза = idle + ключи приёма с env-смешиванием на краях */
function computePose(time, act){
  const idle = idleState(time);
  if (act.t < 0) return idle;
  const m = MOVES[act.i];
  const u = clamp(act.t / m.dur, 0, 1);
  const env = clamp(Math.min(u/0.16, (1-u)/0.22), 0, 1);
  const k = evalKeys(m.keys, u);
  const P = {};
  for (const f in idle) P[f] = lerpVal(idle[f], k[f] !== undefined ? k[f] : idle[f], env);
  return P;
}
function lerpVal(a, b, t){
  if (typeof a === 'number') return a + (b-a)*t;
  return lerpV(a, b, t);
}

    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = new AC();
      const b = this.ac.createBuffer(1, (this.ac.sampleRate*0.3)|0, this.ac.sampleRate);
      const d = b.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      this.nbuf = b;
    }catch(e){ this.ac=null; }
  },
  resume(){ if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  _n(dur, freq, q, vol, type){
    if (!this.ac || !this.enabled) return;
    const c = this.ac, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.nbuf;
    const f = c.createBiquadFilter(); f.type = type||'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t+dur);
    s.connect(f); f.connect(g); g.connect(c.destination);
    f.frequency.setValueAtTime(freq, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(80, freq*0.45), t+dur);
    s.start(t); s.stop(t+dur+0.02);
  },
  _t(dur, f0, f1, vol, type){
    if (!this.ac || !this.enabled) return;
    const c = this.ac, t = c.currentTime;
    const o = c.createOscillator(); o.type = type||'sine';
    const g = c.createGain();
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t+dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+dur+0.02);
  },
  hit(k){ this._n(0.12, 900, 1.4, 0.30*k); this._t(0.16, 150, 52, 0.55*k, 'triangle'); },
  swish(){ this._n(0.13, 2400, 2.2, 0.10); },
  jump(){ this._t(0.14, 210, 420, 0.12); this._n(0.10, 500, 1, 0.06); },
  land(){ this._t(0.12, 90, 45, 0.3); this._n(0.14, 300, 1, 0.16); },
  tick(){ this._t(0.05, 660, 520, 0.06, 'square'); },
};

/* ============================================================
   Раздел 9. ИГРОВОЕ СОСТОЯНИЕ + ГЛАВНЫЙ ЦИКЛ
   ============================================================ */

const G = {
  time:0, act:null, auto:true, autoWait:0.9,
  hitFired:false, landFired:false,
  fps:60, fpsAcc:0, fpsN:0, fpsT:0, nPoly:0,
  camYaw:0.70, dragging:false, dragX:0, dragYaw:0,
};

function triggerMove(i){
  G.act = { i, t:0 };
  G.hitFired = false; G.landFired = false;
  SND.swish();
}

function spawnDust(p, n, spread, col, up){
  for (let i=0;i<n;i++){
    const a = Math.random()*TAU, r = Math.random()*spread;
    emitPart(
      {x:p.x+Math.cos(a)*0.03, y:Math.max(p.y, 0.01), z:p.z+Math.sin(a)*0.03},
      {x:Math.cos(a)*r*(up?1.6:3.2), y: up? (1.4+Math.random()*2.4) : Math.random()*1.6, z:Math.sin(a)*r*(up?1.6:3.2)},
      col, 0.4+Math.random()*0.5, 0.028+Math.random()*0.05, 0.9, 0.94
    );
  }
}

function onHit(p, dir, part, power){
  DUM.v += power * (part.startsWith('foot') ? 4.6 : 3.0);
  RD.cam.shake = Math.min(1, RD.cam.shake + 0.65*power);
  RD.flash.push({p:{x:p.x,y:p.y,z:p.z}, t:0, dur:0.22, r:0.26});
  spawnDust(p, 14, 2.6, [216,184,138], false);
  spawnDust(p, 6, 1.8, [255,214,140], true);
  // щепки
  for (let i=0;i<5;i++){
    const a = Math.random()*TAU;
    emitPart(p, {x:Math.cos(a)*2.2, y:1.2+Math.random()*2.4, z:Math.sin(a)*2.2},
      COL.woodLite, 0.5, 0.014, 1.3, 0.99);
  }
  SND.hit(power);
}

function tipPos(sk, part){
  if (part === 'handL') return V.add(sk.armL.E, V.mul(sk.armL.dir, 0.13));
  if (part === 'handR') return V.add(sk.armR.E, V.mul(sk.armR.dir, 0.13));
  if (part === 'footL') return V.add(sk.footL.p, V.mul(sk.footL.d, 0.09));
  return V.add(sk.footR.p, V.mul(sk.footR.d, 0.09));
}

/* шаг симуляции: возвращает число полигонов (после render) */
function step(dt){
  G.time += dt;

  if (!G.act){
    if (G.auto){
      G.autoWait -= dt;
      if (G.autoWait <= 0){
        triggerMove((Math.random()*MOVES.length)|0);
        G.autoWait = 99; // выставится по окончании приёма
      }
    }
  } else {
    const m = MOVES[G.act.i];
    const tPrev = G.act.t;
    G.act.t += dt;
    const t = G.act.t;
    if (m.hit && !G.hitFired && t >= m.hit[0] && t < m.hit[1]){
      // проверяем каждый кадр окна — «попадание читается» даже при 30 fps
      const P = computePose(G.time, G.act);
      const skT = buildSkeleton(P);
      const tip = tipPos(skT, m.hit[2]);
      const dh = dummyHit(tip, m.hit[3]);
      if (dh){
        G.hitFired = true;
        onHit({x:dh.x, y:dh.y, z:dh.z}, null, m.hit[2], clamp(0.75+dh.horiz*0.4,0.7,1.35));
      }
    }
    if (m.land && !G.landFired && t >= m.land[0] && t <= m.land[1]){
      G.landFired = true;
      spawnDust({x:0, y:0.01, z:-0.1}, 10, 2.6, [200,170,130], false);
      spawnDust({x:0, y:0.01, z: 0.2}, 10, 2.6, [200,170,130], false);
      SND.land();
    }
    if (t >= m.dur){
      G.act = null;
      if (G.auto) G.autoWait = 0.45 + Math.random()*1.15;
    }
  }

  const P = computePose(G.time, G.act || {t:-1});
  const sk = buildSkeleton(P);

  dummyUpdate(dt);
  updateParts(dt);
  if (!CLOTH.band.seeded) CLOTH.seed(sk);
  CLOTH.update(sk, Math.min(dt, 1/50), G.time);

  RD.shadow.x = sk.pelvis.o.x; RD.shadow.z = sk.pelvis.o.z;
  const air = clamp((P.y + 0.05)/0.6, 0, 1);
  RD.shadow.r = 0.62 - 0.30*air;
  RD.shadow.a = 0.34 - 0.20*air;

  RD.begin();
  buildDummy();
  buildBody(sk);
  CLOTH.draw();
  G.sk = sk; G.P = P;
  return sk;
}

/* ============================================================
   Раздел 10. HUD / ВВОД / ЗАПУСК (только в браузере)
   ============================================================ */

function boot(){
  const cv = document.getElementById('cv');
  RD.init(cv);
  window.addEventListener('resize', ()=>RD.resize());

  /* кнопки приёмов */
  const moveNames = ['JAB','CROSS','KICK','SPIN','SPLIT'];
  const bar = document.getElementById('bar');
  moveNames.forEach((n, i)=>{
    const b = document.createElement('button');
    b.className = 'mbtn'; b.textContent = n; b.dataset.move = i;
    b.addEventListener('pointerdown', e=>{
      e.preventDefault(); SND.init(); SND.resume(); SND.tick();
      triggerMove(i);
    });
    bar.appendChild(b);
  });
  const ab = document.createElement('button');
  ab.className = 'mbtn auto'; ab.textContent = 'AUTO: ON';
  ab.addEventListener('pointerdown', e=>{
    e.preventDefault(); G.auto = !G.auto;
    ab.textContent = 'AUTO: ' + (G.auto?'ON':'OFF');
    ab.classList.toggle('off', !G.auto);
  });
  bar.appendChild(ab);

  /* орбита камеры перетаскиванием */
  let drag = null;
  cv.addEventListener('pointerdown', e=>{ drag = {x:e.clientX, y:e.clientY, yaw:RD.cam.yaw, p:RD.cam.pitch}; });
  cv.addEventListener('pointermove', e=>{
    if (!drag) return;
    RD.cam.yaw = clamp(drag.yaw - (e.clientX-drag.x)*0.006, -0.45, 2.4);
    RD.cam.pitch = clamp(drag.p + (e.clientY-drag.y)*0.004, 0.02, 0.9);
  });
  const stopDrag = ()=>{ drag = null; };
  cv.addEventListener('pointerup', stopDrag); cv.addEventListener('pointercancel', stopDrag);
  cv.addEventListener('wheel', e=>{
    RD.cam.dist = clamp(RD.cam.dist + e.deltaY*0.002, 2.6, 7.5); e.preventDefault();
  }, {passive:false});

  const elFps = document.getElementById('fps');
  const elPoly = document.getElementById('poly');

  let last = performance.now(), scaleAcc = 0;
  function frame(now){
    const dt = clamp((now-last)/1000, 1/240, 1/24);
    last = now;
    step(dt);
    G.nPoly = RD.render();

    /* FPS + авто-масштаб рендера (борьба за 55+ на слабом моб.) */
    G.fpsAcc += 1/Math.max(dt,1e-3); G.fpsN++;
    scaleAcc += dt;
    if (scaleAcc > 0.5){
      G.fps = G.fpsAcc/G.fpsN; G.fpsAcc=0; G.fpsN=0;
      elFps.textContent = G.fps.toFixed(0)+' FPS';
      elPoly.textContent = G.nPoly+' POLY';
      if (G.fps < 48 && RD.renderScale > 0.62){ RD.renderScale *= 0.85; RD.resize(); }
      else if (G.fps > 58 && RD.renderScale < 1){ RD.renderScale = Math.min(1, RD.renderScale*1.06); RD.resize(); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  SND.init(); // на многих моб. браузерных движках резюмится по первому касанию
}

if (typeof window !== 'undefined' && typeof document !== 'undefined'){
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}

/* экспорт для автотестов (в браузере безвреден) */
if (typeof globalThis !== 'undefined'){
  globalThis.__FB = {
    V, rotV, clamp, lerp, lerpV, makeFrame, subFrame, frameFromDir, fOff,
    l2w, d2w, ikLimb, pelvisFrame, buildSkeleton,
    COL, B, buildBody, drawJoints, drawHand, drawFoot, drawBand, drawBelt,
    CLOTH, makePanel, MOVES, evalKeys, idleState, computePose,
    RD, seg, lathe, box, DUM, dummyUpdate, buildDummy, dummyHit,
    step, triggerMove, G, VERSION, parts, PMAX,
  };
}
